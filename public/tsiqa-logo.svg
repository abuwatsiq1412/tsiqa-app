<svg width="340" height="110" viewBox="0 0 340 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tsiqaTealGrad" x1="20" y1="10" x2="86" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Logomark Symbol -->
  <g transform="translate(10, 5)">
    <!-- Outer Arch / Q Body (Gerbang Kubah Pesantren & Badan Huruf Q) -->
    <path d="M50 10 C38 22 20 36 20 60 C20 78 33 92 50 92 C67 92 80 78 80 60 C80 36 62 22 50 10 Z" 
          stroke="url(#tsiqaTealGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner T Pillar & Crossbar (Tiang Integritas & Keadilan 'Adalah) -->
    <path d="M36 44 H64" stroke="#0d9488" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M50 44 V76" stroke="#0d9488" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Q Tail / Dynamic Trust Stroke (Simpul Amanah & Arah Pertumbuhan) -->
    <path d="M68 76 L86 94" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round"/>
    <circle cx="86" cy="94" r="3.5" fill="#2dd4bf"/>

    <!-- Noor Point in Apex (Cahaya Ilmu) -->
    <circle cx="50" cy="28" r="3" fill="#2dd4bf"/>
  </g>

  <!-- Logotype Text -->
  <text x="120" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="#0f766e">
    TSIQA
  </text>
  <text x="245" y="56" font-family="'Amiri', 'Traditional Arabic', serif" font-weight="700" font-size="32" fill="#0d9488">
    ثِقَة
  </text>
  <text x="122" y="82" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="1.2" text-transform="uppercase" fill="#64748b">
    Sistem Manajemen Pesantren
  </text>
</svg>
